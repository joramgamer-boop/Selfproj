<!doctype html>
<!--
  Published at the root of the repository's Pages site (/Selfproj/), where it
  sends Visitors on to the profile site. The workflow copies it there; it is
  not part of the Astro build.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <meta http-equiv="refresh" content="0; url=/Selfproj/profile-site/" />
    <link rel="canonical" href="https://joramgamer-boop.github.io/Selfproj/profile-site/" />
    <title>Redirecting to the profile site</title>
  </head>
  <body>
    <p>
      The profile site is at
      <a href="/Selfproj/profile-site/">/Selfproj/profile-site/</a>.
    </p>
  </body>
</html>
